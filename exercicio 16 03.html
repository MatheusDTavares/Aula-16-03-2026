<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="aposta1">
    <input type="text" id="aposta2">
    <input type="text" id="aposta3">
    <input type="text" id="aposta4">
    <input type="text" id="aposta5">
    <button onclick="Exibir()">Exibir resultado</button>
    <div id="resultado"></div>
</body>

<script>
    let ganhadores = ["Janna","Lucian","Nami","Viktor","Yasuo"]

    function Exibir(){
        let acertos = 0
        let totalNomes = ganhadores.length
        let mensagem = ""

        let palpites = [
            aposta1.value.trim(),
            aposta2.value.trim(),
            aposta3.value.trim(),
            aposta4.value.trim(),
            aposta5.value.trim()
        ]

        if(palpites[0] == ganhadores[0]){
            acertos++
            mensagem += `1º Nome Certo: ${ganhadores[0]} | Sua resposta: ${palpites[0]}<br>`
        }

        if(palpites[1] == ganhadores[1]){
            acertos++
            mensagem += `2º Nome Certo: ${ganhadores[1]} | Sua resposta: ${palpites[1]}<br>`
        }

        if(palpites[2] == ganhadores[2]){
            acertos++
            mensagem += `3º Nome Certo: ${ganhadores[2]} | Sua resposta: ${palpites[2]}<br>`
        }

        if(palpites[3] == ganhadores[3]){
            acertos++
            mensagem += `4º Nome Certo: ${ganhadores[3]} | Sua resposta: ${palpites[3]}<br>`
        }

        if(palpites[4] == ganhadores[4]){
            acertos++
            mensagem += `5º Nome Certo: ${ganhadores[4]} | Sua resposta: ${palpites[4]}<br>`
        }

        let erros = totalNomes - acertos

        if(erros <= 2){
            mensagem += `Você conhece bem essa competição<br>`
        } else {
            mensagem += `Você precisa acompanhar mais essa competição!<br>`
        }

        resultado.innerHTML = `${mensagem}Seus erros foram: ${erros}`
    }
</script>
</html>
