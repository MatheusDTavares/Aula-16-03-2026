<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
    body{
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin: 0;
        background-color: silver;
    }
    input{
         border-radius: 10px;
        padding: 8px;
        border: 1px solid #ccc;
    }
    button{
        border-radius: 10px;
        padding: 8px;
        border: 1px solid #ccc;
    }

    .container{
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
</style>
    <h2>Melhores campeões do LOLzinho</h2>
    <img src="https://media.tenor.com/4tSl7PT7ksYAAAAM/teemo.gif" width="250" height="200"><br><br>
    <!--atividade 1-->
    <h3>Digite os nomes chaves 🔑</h3>
    <input type="text" id="aposta1">
    <input type="text" id="aposta2">
    <input type="text" id="aposta3">
    <input type="text" id="aposta4">
    <input type="text" id="aposta5">
    <button onclick="Exibir()">Exibir resultado</button>
    <div id="resultado"></div>

    <!--Aqui são os textos da função meus campeões-->
    <div class="container"><div  id="textos" style="display: none;" ><h2>MEUS CAMPEÕES</h2></div>
    <input  id="ipt_campeoes"type="text" style="display: none;" ><br>
    <button id="novocampeao" onclick="adicionando()" style="display: none;" >Adicionar</button><br>
    <div id="resultado2"></div><br>
    <div id="lista"></div></div><br>

    <!--Aqui são os testos da função procurar-->
    <div class="container">
    <input id="ipt_busca" type="text" style="display: none;" ><br>
    <button id="procurar" style="display: none;" onclick="buscando()">Buscar</button><br>
    <div id="procura" style="display: none;" ></div></div>
</body>

<script>
    let ganhadores = ["Vayne","Jinx","Lucian","Azir","Ashe"]
    let meusCampeoes = []
    function Exibir(){
        let acertos = 0
        let totalNomes = ganhadores.length
        let mensagem = ""
        let mensagem_erro = ""

        let palpites = [
            aposta1.value.trim(),
            aposta2.value.trim(),
            aposta3.value.trim(),
            aposta4.value.trim(),
            aposta5.value.trim()
        ]

        if(palpites[0] == ganhadores[0]){
            acertos++
            mensagem += `  1º Nome Certo: ${ganhadores[0].toUpperCase()} 🥇 | <br>Sua resposta: ${palpites[0]}<br>`
        }
        else{
            mensagem_erro += `<b><h4>Errou ❌</b> 1º Nome Certo: ${ganhadores[0]} | <br>Sua resposta: ${palpites[0]}<br>`
        }

        if(palpites[1] == ganhadores[1]){
            acertos++
            mensagem += `2º Nome Certo: ${ganhadores[1]} | <br>Sua resposta: ${palpites[1]}<br>`
        }
        else{
            mensagem_erro += `<b>Errou ❌</b> 2º Nome Certo: ${ganhadores[1]} | <br>Sua resposta: ${palpites[1]}<br>`
        }

        if(palpites[2] == ganhadores[2]){
            acertos++
            mensagem += `3º Nome Certo: ${ganhadores[2]} | <br>Sua resposta: ${palpites[2]}<br>`
        }
        else{
            mensagem_erro += `<b>Errou ❌</b> 3º Nome Certo: ${ganhadores[2]} | <br>Sua resposta: ${palpites[2]}<br>`
        }

        if(palpites[3] == ganhadores[3]){
            acertos++
            mensagem += `4º Nome Certo: ${ganhadores[3]} | <br>Sua resposta: ${palpites[3]}<br>`
        }
        else{
            mensagem_erro += `<b>Errou ❌</b> 4º Nome Certo: ${ganhadores[3]} | <br>Sua resposta: ${palpites[3]}<br>`
        }

        if(palpites[4] == ganhadores[4]){
            acertos++
            mensagem += `5º Nome Certo: ${ganhadores[4]} | <br>Sua resposta: ${palpites[4]}<br><br>`
        }
        else{
            mensagem_erro += `<b>Errou ❌</b> 5º Nome Certo: ${ganhadores[4]} | <br>Sua resposta: ${palpites[4]}<br>`
        }

        let erros = totalNomes - acertos

        if(erros <= 2){
            mensagem += `<br>Você conhece bem essa competição<br>`
        } else {
            mensagem += `<br>Você precisa acompanhar mais essa competição!<br>`
        }

        resultado.innerHTML = `${mensagem}Seus erros foram: ${erros} ${mensagem_erro}<br>`

        novocampeao.style.display = "block"
        textos.style.display = "block"
        ipt_campeoes.style.display = "block"
        
        
    }
    function adicionando(){
        let campeoes = ipt_campeoes.value;
       
        meusCampeoes.push(campeoes);

        resultado2.innerHTML = `Seus campeões:${meusCampeoes}`

        procura.style.display = "block"
       ipt_busca.style.display = "block"
        procurar.style.display = "block"
        
    }
    function buscando(){
        let busca = ipt_busca.value.trim()
        let temUsuario = meusCampeoes.includes(busca)
        let temSistema = ganhadores.includes(busca)
        if(temUsuario && temSistema ){
            procura.innerHTML = `Está na lista de ambos`
        }
        else if(temSistema){
            procura.innerHTML = `Está na lista do sistema`
        }
        else if(temUsuario){
            procura.innerHTML = `Está na lista do usuário`
        }
        else{
            procura.innerHTML = `Campeão não encontrado`
        }

    }

    

</script>
</html>
